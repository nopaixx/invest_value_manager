# PROTOCOL:
# 1. After EVERY agent completion, check META-REFLECTION section
# 2. Extract items → add here with id, type, source, finding
# 3. Items with deadlines → check at session start
# 4. ANOMALY items → investigate before next pipeline advancement for that ticker
# 5. SUGGESTION items → batch review weekly (Sunday audit)
# 6. QUESTION items → answer immediately, document here
# 7. Weekly: count OPEN items. If >20 → pipeline pause until reduced to <10
# 8. NEVER delete items — mark RESOLVED with date + evidence

