  red:
    # =========================================================================
    # NVO - ESCALATED RED: FDA WARNING LETTER + KC#1 TRIGGERED + Securities Probes
    # =========================================================================
    - ticker: NVO
      risk_type: REGULATORY_FDA + KILL_CONDITION_TRIGGERED + LEGAL
      description: >
        ESCALATED (2026-03-17): THREE concurrent risk vectors:
        1) FDA WARNING LETTER (Mar 5, 2026): "Serious violations" of PADE reporting.
        Failed to report 3 DEATHS (including 1 suicide) among semaglutide patients
        within required 15-day timeframe. Some reports >1,000 days late. Stemmed
        from Jan-Feb 2025 inspection of US headquarters. Follow-up procedures
        improperly required reporter consent, delaying investigation. FDA stressed
        this does NOT mean drugs caused deaths — concern is reporting compliance.
        THIS IS NEW since last scan (Mar 6). Major media coverage (Bloomberg, NBC,
        CBS, The Hill, US News). Stock impact: decline post-publication.
        2) KC#1 TRIGGERED (Feb 23): CagriSema REDEFINE 4 FAILED. Unchanged.
        3) Securities fraud investigations (Pomerantz, Schall): Ambulance-chasing
        firms, NOT SEC. Triggered by CagriSema failure stock drop.
        POSITIVE: NVO sued Hims & Hers (Feb 9) for patent infringement on
        compounded semaglutide. FDA cracking down on compounders (30 telehealth
        enforcement actions Mar 2026). Hims retreated from semaglutide pill.
        This PROTECTS NVO's GLP-1 franchise from compounding dilution.
      source: "fda.gov (warning letter 717576), bloomberg.com, thehill.com, biospace.com, cnbc.com, benzinga.com"
      date_detected: 2026-02-23
      date_updated: 2026-03-17
      kill_condition_triggered: true
      kill_condition_detail: >
        KC#1: CagriSema inferiority. TRIGGERED Feb 23. Unchanged.
        NEW RISK to KC#3 (gross margin <70%): FDA warning letter could lead to
        remediation costs, enhanced pharmacovigilance spending. Monitor Q1.
        FDA warning is NOT a KC directly, but adds regulatory overhang.
      recommendation: >
        HOLD LOW conviction. FDA warning letter is PROCEDURAL (reporting delays),
        not SAFETY (drugs not shown to cause deaths). No product recall, no sales
        restrictions. Typical resolution: corrective action plan + enhanced reporting.
        However: combined with KC#1 triggered + securities probes = triple headwind.
        No ADD under any circumstances. Monitor Q1 FY2026 (~May) for:
        (a) Revenue trajectory (KC#8: decline >10% = SELL),
        (b) Gross margin (KC#3: <70% = SELL),
        (c) Market share (<40% = SELL).
        If formal SEC investigation opens (not ambulance chasers) = ESCALATE to
        EXIT evaluation immediately. Position -19.7% unrealized.

    # =========================================================================
    # EDEN.PA - ESCALATED TO RED: Brazil Guidance Cut + Multi-Jurisdiction
    # =========================================================================
    - ticker: EDEN.PA
      risk_type: REGULATORY_BRAZIL + GUIDANCE_CUT + MULTI_JURISDICTION
      description: >
        ESCALATED RED (2026-03-17): MATERIAL NEW DEVELOPMENT since last scan.
        Brazil PAT decree (Nov 12, 2025) — Federal Regional Court CONFIRMED
        applicability to meal voucher issuers. Key regulatory changes:
        - Merchant discount rate CAPPED at 3.6% (including 2% interchange ceiling)
        - Settlement period CUT from ~30 days to 15 days (float revenue halved)
        - Full interoperability required within 360 days
        EBITDA GUIDANCE REVISED: from +2% to +4% down to -8% to -12% for 2026.
        Impact: EUR 150-200M negative on 2026 EBITDA. Stock fell ~9% on news.
        Brazil = ~9% of group revenue but disproportionate EBITDA contribution.
        Edenred initiated legal proceedings — decision expected end-2026 at earliest.
        Company says FY27+ growth trajectory resumes (similar to Italy precedent).
        THESIS IMPACT: At FY2025 earnings (Feb 24), guidance was +8/+12% for
        2027-28. The 2026 base is NOW materially lower. KC#6 (2027-28 guide <5%)
        needs reassessment — lower base means even maintained growth rates produce
        less absolute EBITDA. KC#7 MONITORING ELEVATED for fintech/regulation
        convergence.
        Turkey antitrust: historical (2018 fine EUR 1M). No new action detected.
        France levy: RULED OUT by Minister. KC#1 MONITORING unchanged.
        SI collapsed from 21.2% to 9.64% (positive). Citadel covered.
      source: "edenred.com, investing.com, ilsole24ore.com, marketscreener.com, morningstar.com"
      date_detected: 2026-02-09
      date_updated: 2026-03-17
      kill_condition_triggered: false
      kill_condition_at_risk: >
        KC#6 (2027-28 guidance <5%): NOT YET TRIGGERED but at ELEVATED RISK.
        2026 EBITDA base now -8% to -12% lower. If 2027 guidance comes in at
        "recovery to +5-8% on LOWER base," absolute EBITDA could still be below
        2025 levels. This is the zone where KC#6 approaches.
        KC#7 (fintech disruption): MONITORING ELEVATED. Brazil interoperability
        mandate = structural reduction in switching costs. Combined with fintech
        competition, this is the bear thesis materializing in one market.
      recommendation: >
        NEEDS THESIS REVIEW. Position is 18.7% of portfolio (LARGEST). FV EUR 29
        was set BEFORE guidance cut. If 2026 EBITDA is -10% (midpoint), organic
        EBITDA ~EUR 1.05B vs prior ~EUR 1.17B. At 12x EBITDA, FV drops to
        ~EUR 22-25. CURRENT PRICE likely near EUR 17-19. The E[CAGR] calculation
        must be recalculated with revised FV. URGENT: thesis FV update needed
        before next session. DO NOT ADD. Consider TRIM if recalculated E[CAGR]
        drops below 12%. SI decline is positive but does not offset fundamental
        guidance cut.

