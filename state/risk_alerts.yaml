        2) CVE-2026-24858 (Jan 2026): CRITICAL auth bypass (CVSS 9.4). FortiOS
        SSO zero-day actively exploited. Rogue admin accounts created, configs
        exfiltrated. Fortinet disabled SSO globally Jan 26, patched Jan 27. CISA
        added to KEV catalog. This is the irony flagged by DA: cybersecurity
        company's own products have critical vulnerabilities.
        Pattern: CVE-2025 series + CVE-2026-24858 = recurrent security issues.
      source: "rgrdlaw.com, businesswire.com, thehackernews.com, cisa.gov, socprime.com"
      date_detected: 2026-03-06
      kill_condition_triggered: false
      kill_condition_at_risk: >
        KC#4 (SEC investigation): NOT triggered. Class action is private litigation.
        KC#6 (2nd major security incident in 6mo causing customer attrition):
        CVE-2026-24858 in Jan 2026 is INCIDENT #1. If a 2nd incident occurs before
        Jul 2026 AND customer churn is visible, KC#6 triggers. Monitor Q1 billings.
      recommendation: >
        HOLD. Class action priced in (stock near 52wL at purchase). CVE-2026-24858
        patched within 24h. But PATTERN of vulnerabilities is concerning for a
        cybersecurity vendor. April 2026 earnings = key data point for billings
        and customer retention. If billings decelerate AND churn increases, KC#6
        approaches. Update thesis to track CVE-2026-24858 as first incident.

