# =============================================================================
# THEMATIC BASKETS — The Fund IS Its Baskets (P17 v4.7)
# =============================================================================
# The portfolio REVOLVES around thematic baskets. They are the TOP-DOWN
# organizing principle, not labels for existing positions.
#
# CIO's primary job:
#   1. DISCOVER best secular themes (>30% CAGR potential over 10+ years)
#   2. BUILD baskets around those themes with highest-quality companies
#   3. MONITOR each basket as a living entity
#   4. KILL baskets when themes die, BIRTH new ones when superior themes emerge
#
# SAFETY: Per-stock R1-R4 gates stay intact. Max 2 new positions/session/basket.
# See error #57 and P17 in principles.md.
#
# NO FIXED ALLOCATION TARGETS. Allocation is REASONED each session based on
# conviction, E[CAGR], and theme vitality. See allocation_reasoning below.
#
# Created: 2026-02-22 | Restructured: 2026-02-27 (v4.7 living entity model)
# =============================================================================

