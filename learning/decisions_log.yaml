short_decisions:

  - date: 2026-02-20
    ticker: LYV
    action: "PAUSE (post-S4 approval, pre-execution)"
    context:
      quality_score: 41
      tier: C
      fair_value_short: "$85 (S3, UNDER REVIEW → $107-127 at 8-10% growth)"
      approved_sizing: "1% (EUR 100)"
      stop_loss: "$195"
      catalyst: "DOJ antitrust trial March 2, 2026"
      pipeline: "S1→S2→S3→S4 complete (first full short pipeline)"
    reasoning: |
      S4 APPROVED CONDITIONAL (Session 76, Feb 18). Pre-condition: Q4 results review.
      Q4 FY2025 published Feb 19: STRONG BEAT.
      - Revenue $6.3B (+11% YoY) vs consensus $6.1B. FY $25.2B (+9%).
      - AOI $2.4B (+10%). Operating income +52% YoY.
      - TM AOI share DECLINED 52% → 45.8% (thesis pillar: "TM = profit engine" WEAKENED).
      - Concerts AOI surged +30%. Diversification improving.
      - FCF expanded 4.5% → ~5.2% (thesis pillar: "FCF stuck" WEAKENED).
      - Deferred revenue $4.0B (+21%). 67M tickets already sold for 2026.
      - KC#3 TRIGGERED: Q3 +11% + Q4 +11% = 2 consecutive quarters >10%.
      POST-Q4 ASSESSMENT:
      - 4 of 6 thesis pillars weakened (growth, TM concentration, FCF, reverse DCF gap)
      - 2 of 6 GO conditions FAILED (growth >10%, FCF expanding)
      - Pre-Q4 expected value was already marginal (-1.4% to +1%)
      - Reverse DCF at 8-10% growth → FV $107-127 (below $130 CANCEL threshold)
      - Error #46: overvaluation alone ≠ short thesis. Remaining pillars = valuation + antitrust.
      DECISION: PAUSE, not CANCEL. FV still <$130. Trial Mar 2 still happening.
      Monitor from sidelines. Re-evaluate post-trial first week of March.
    outcome: "Standing order PAUSED. Entry window Feb 20-28 NOT used."
    precedent_set: |
      FIRST SHORT DECISION IN SYSTEM. Establishes:
      1. Post-S4 PAUSE pattern: If pre-execution conditions reveal material thesis change,
         PAUSE is valid even with S4 approval. S4 is not irrevocable commitment.
      2. KC trigger = RE-EVALUATE, not automatic action. KC#3 triggered → re-evaluated →
         decided PAUSE. The kill condition framework works as designed.
      3. Earnings pre-condition governance: Q4 review CHANGED the decision. The pre-execution
         condition prevented entering a weakened thesis. System worked correctly.
      4. Discipline > conviction: Walking away from an approved short when data deteriorates
         is MORE valuable than forcing execution because "we did the work."

# =============================================================================
# PATRONES IDENTIFICADOS
# =============================================================================
patterns:
  sizing_by_tier:
    tier_a:
      typical_range: "3-5% initial"
      examples: "ADBE 4.8%, NVO 3.4%, MONY.L 4.1%, AUTO.L 3.4%, LULU 3.5%, BYIT.L 3.5%"
      rationale: "Quality compounders permiten posiciones mayores por menor riesgo"
    tier_b:
      typical_range: "2-5% (full 4%, half 2% for binary events)"
      examples: "ROP 4%, VLTO 4%, ACGL 4%, MMC 2% (half/Greensill), HRB 5.7% (pre-adversarial)"
      rationale: "Quality value, riesgo moderado. Half-position for binary legal events."
    tier_c:
      typical_range: "3-4% max"
      examples: "SHEL.L trimmed to ~7% from 13%"
      rationale: "Mayor riesgo, limitar exposición"

  mos_acceptance_by_tier:
    tier_a: "10-15% mínimo típico, 30%+ es excepcional"
    tier_b: "18-25% typical (18.4% lowest accepted — MMC with exceptional WIDE moat + HALF POSITION due to Greensill binary event; not a universal floor)"
    tier_c: "30%+ requerido"
    note: "Estos no son límites fijos, son patrones observados. WIDE moat justifies lower MoS floor."

  conditional_approvals:
    description: "Pattern emergente: R4 approval con condiciones que deben cumplirse antes de ejecución"
    examples:
      - ticker: RACE.MI
        condition: "BUY at EUR 270, ADD at EUR 260. EUR 260 requires verification of EBIT growth trajectory"
        date: 2026-02-12
      - ticker: DSY.PA
        condition: "BUY at EUR 15.50. WAIT for Q1 FY2026 results to confirm cloud transition trajectory"
        date: 2026-02-11
      - ticker: MMC
        condition: "HALF POSITION only (EUR 200 vs EUR 400 standard). Full position after Greensill trial resolution (Aug 2026+)"
        date: 2026-02-14
    note: "Conditional approvals allow pre-positioned standing orders while managing event risk. The condition is part of the governance, not optional."

  half_position_sizing:
    description: "Pattern para empresas con eventos binarios pendientes (mega-litigación, decisiones regulatorias)"
    examples:
      - ticker: MMC
        size: "2% (EUR 200 vs 4% standard)"
        reason: "Greensill A$7B trial Aug 2026. Upgrade to full after resolution."
        date: 2026-02-14
    note: "Aplicable a cualquier empresa con >$500M litigación pendiente o decisión regulatoria binaria."

  fv_rounding_cap:
    description: "FV quality premium above weighted method average capped at 10%. Larger premiums must use explicit higher multiples."
    examples:
      - ticker: ADDT-B.ST
        weighted_avg: "SEK 210"
        r1_fv: "SEK 250 (+19% premium — REJECTED)"
        r3_fv: "SEK 225 (+7% premium — ACCEPTED)"
        reason: "The +19% quality premium double-counted quality already in QS. If analyst believes multiple is conservative, use higher multiple explicitly, not backdoor through rounding."
        date: 2026-02-19
    note: "Max 10% quality premium on weighted FV. Beyond that, the analyst must justify a higher explicit multiple in the valuation method."

  serial_acquirer_market_position:
    description: "Serial acquirers with 100+ micro-niche subsidiaries do NOT have traditional market position in a measurable TAM. QS market position adjustment capped at +3."
    examples:
      - ticker: ADDT-B.ST
        r1_adjustment: "+5 market position (REJECTED by R2/R3)"
        r3_adjustment: "+3 market position (ACCEPTED)"
        reason: "Serial acquirer ranking in Nordic space is business model quality, not addressable market dominance. Addtech has ~1.5-2% of EUR 50B industrial distribution — not #3-5 in any measurable TAM."
        date: 2026-02-19
    note: "For serial acquirers: +3 for brand/scale in acquirer ecosystem. +5 only if >10% share in a measurable addressable market."

# =============================================================================
# LECCIONES APRENDIDAS
# =============================================================================
lessons:
  - date: 2026-02-05
    lesson: "Sector entero puede ser value trap - P/E bajo sectorial no es oportunidad"
    from_decision: "Auto EU analysis: VW (QS 20) y BMW (QS 24) - ambos Tier D REJECT"
    impact: |
      Evitó invertir en sector que destruye valor.
      El 'top pick' de analistas (VW) y el 'quality play' según Goldman (BMW) son ambos Tier D.
      P/E 7x refleja problemas reales (ROIC < WACC, FCF negativo), no oportunidad.
      Los analistas con mandato diferente (trading/momentum) pueden estar equivocados para value investing.
      Crear sector view ANTES de analizar evita sesgo de confirmación.

  - date: 2026-02-06
    lesson: "Rotar de Tier C a Tier A genera alpha - no mantener posiciones de baja calidad cuando hay alternativas"
    from_decision: "SHEL.L EXIT → AUTO.L BUY (capital rotation)"
    impact: |
      Rotacion de commodity play (QS 36, MoS -3.5%) a monopoly platform (QS 79, MoS 29%).
      Upgrade masivo en calidad, valoracion, riesgo y crecimiento.
      HOLD previo (2026-02-05) fue correcto cuando no habia alternativa.
      Cuando aparecio alternativa Tier A, el contexto cambio materialmente.
      El costo de oportunidad de mantener low-quality es real y cuantificable.

  - date: 2026-02-04
    lesson: "No comprar por P/E bajo sin verificar Quality Score"
    from_decision: "FUTR.L exit"
    impact: "Evitó value trap, QS ahora es obligatorio antes de valorar"

  - date: 2026-02-03
    lesson: "Distinguir crecimiento orgánico vs sobrecompra"
    from_decision: "DTE.DE, SHEL.L trims"
    impact: "TRIM de sobrecompra es correcto; TRIM de ganador orgánico requiere más análisis"

  - date: 2026-02-12
    lesson: "Serial acquirers need special QS treatment — goodwill distorts ROIC but full stripping overstates quality"
    from_decision: "ROP analysis: QS 48 tool vs 76 thesis vs 70 R3-resolved (+22)"
    impact: |
      quality_scorer.py reports ROIC < WACC for ALL serial acquirers (CSU.TO, DHR, TDG, ROP)
      because goodwill from acquisitions inflates invested capital. But full stripping
      also overstates quality (ignoring that acquisitions required real capital).
      SOLUTION: Partial-goodwill approach (50% goodwill as capital). ROIC on this basis
      shows true economic picture. ROP: 12% ROIC, +3pp spread (positive but modest).
      Applies to: CSU.TO, DHR, TDG, HLMA.L, DPLM.L, JDG.L, NIBE.ST.
      Max QS adjustment: +20 without committee approval, +22 with per-item documentation.

  - date: 2026-02-12
    lesson: "SaaSpocalypse introduces per-seat pricing risk for ALL software positions"
    from_decision: "ROP devil's advocate uncovered switching-cost-protects-platform-but-not-pricing insight"
    impact: |
      AI agents reduce headcount at customer firms. Software retains the customer
      (switching costs protect platform) but LOSES seats (per-seat pricing unprotected).
      This is NOT the same as customer churn — it is SAME customer, LESS revenue.
      Affects: ROP (Deltek, Aderant, Vertafore), ADBE (Creative Cloud seats),
      BYIT.L (Microsoft licenses per user), INTU (QBO per employee), PAYC (per employee).
      Kill condition KC#7 added for ROP. Should consider for all software positions.

  - date: 2026-02-05
    lesson: "Aprovechar pánico de mercado en quality compounders"
    from_decision: "NVO buy después de -17% en 2 días"
    impact: "MoS excepcional surge del pánico, no del análisis frío del mercado"

  - date: 2026-02-06
    lesson: "ROIC < WACC es signal clave para EXIT - no mantener empresas que destruyen valor economico"
    from_decision: "TEP.PA, LIGHT.AS, PFE exits (tres posiciones con ROIC < WACC)"
    impact: |
      Patron claro: las 3 posiciones vendidas tenian ROIC < WACC.
      Esto significa que destruian valor economico para accionistas.
      Contrastar con Tier A compounders (ROIC spread +20-40pp sobre WACC).
      Leccion: ROIC vs WACC es el filtro mas importante despues de QS.
      Capital rotado a BYIT.L (ROIC >> WACC) = upgrade masivo.

  - date: 2026-02-09
    lesson: "Standing orders that ADD to deteriorating positions amplify losses - adversarial review should precede ADD triggers"
    from_decision: "HRB ADD at $35 (2026-02-05) then SELL at $32.77 (2026-02-09)"
    impact: |
      The ADD standing order for HRB was approved pre-adversarial review.
      10 shares added at $35 on 2026-02-05 lost $22 in 4 days.
      Total loss -$155 (-13.25%) vs -$33 (-4.9%) on original 19 shares alone.
      Lesson: All standing orders should be re-validated through adversarial pipeline
      before execution. ADD triggers for non-Tier-A positions are especially risky.

  - date: 2026-02-09
    lesson: "ROIC < WACC is the most reliable exit signal - now 8/8 positions with this pattern were sold"
    from_decision: "SAN.PA SELL (8th ROIC<WACC exit after TEP.PA, LIGHT.AS, PFE, SHEL.L, A2A.MI, VNA.DE, TATE.L)"
    impact: |
      Perfect consistency: every position where ROIC < WACC was confirmed has been exited.
      SAN.PA ROIC < WACC by -2.1pp confirmed by quality_scorer.py.
      The pattern transcends sectors (pharma, BPO, lighting, energy, utility, REIT, staples).
      Counter-argument tested: "pharma goodwill distorts ROIC" - valid concern but
      even adjusted, the -2.1pp spread suggests value destruction.
      This pattern should be a near-kill-condition for future positions.

  - date: 2026-02-06
    lesson: "MoS original puede ser incorrecto si metodo de valoracion es inapropiado"
    from_decision: "TEP.PA MoS revisado de 38-51% a 17%"
    impact: |
      La thesis original de TEP.PA usaba DCF como metodo primario → MoS 38-51%.
      Review-agent correctamente identifico que DCF es inapropiado para empresa
      enfrentando disruption estructural (AI en BPO). EV/EBIT method → MoS solo 17%.
      Leccion: El MoS no es un dato fijo. Cambia si cambia el metodo de valoracion.
      Siempre cuestionar el metodo usado, especialmente si la thesis se debilita.

  - date: 2026-02-11
    lesson: "44% cash post-adversarial review is capital preservation, not cash drag"
    from_decision: "System Devil's Advocate Challenge #3: Cash vs Deployment Pressure"
    impact: |
      Jan 26→Feb 3: deployed from 2 to 18 positions in 8 days. Result: 8 sold for losses.
      Feb 7→Feb 11: adversarial review sold 8 positions → 44% cash.
      The pressure to redeploy quickly is the SAME pressure that caused the original problem.
      Session-protocol "mentalidad competitiva" REMOVED — replaced with "mentalidad de gestor".
      Precedent: holding cash when pipeline lacks Tier A at discount is the correct decision.
      Cash drag (est. 4.5pp/yr) is LESS costly than deploying into positions that lose 13% (HRB).

  - date: 2026-02-11
    lesson: "UK geographic concentration creates correlated risk — require justification for new UK positions"
    from_decision: "System Devil's Advocate Challenge #1: UK Concentration Bias"
    impact: |
      4/13 positions UK-listed (30% of invested capital). UK = 3.5% of global market cap.
      3/4 are UK digital platforms (MONY.L, AUTO.L, BYIT.L) correlated through UK consumer spending.
      FTSE250 screening produces more "fallen angel" candidates → availability bias.
      GBP -15% scenario = -4.5% portfolio loss from FX alone.
      New rule: before adding ANY new UK position, document why non-UK comparable is inferior.
      Does NOT mean selling existing UK positions — they're there for quality.

  - date: 2026-02-11
    lesson: "quality_scorer.py has structural biases — market_position default +5 and asset-light overrating"
    from_decision: "System Devil's Advocate Challenge #2: QS Tool Bias"
    impact: |
      6 biases identified in quality_scorer.py code:
      1. market_position default = 5/8 (free points for ALL companies)
      2. Paying ANY dividend = 5/5 for shareholder returns
      3. Asset-light businesses mechanically score higher (FCF margin, ROIC, leverage all max)
      4. Only 3-4 years growth data (insufficient for full cycles)
      5. Static sector GM medians
      6. N/A defaults inflate some sub-scores
      Action: Fix market_position default to 0. Review dividend scoring.
      This explains why 12/13 positions had overstated QS — the tool itself overrates.

  - date: 2026-02-18
    lesson: "Orchestrator must NEVER do WebSearch directly — always delegate to agents"
    from_decision: "User caught Error #3 violation: orchestrator used WebSearch for VRSK Q4 and ALLE Q4 earnings instead of delegating to news-monitor or fundamental-analyst"
    impact: |
      The orchestrator rationalized doing WebSearch directly for "quick checks" on earnings results.
      This violated the core principle: YO ORQUESTO, LOS AGENTES EJECUTAN.
      Why it matters: 1) WebSearch introduces unfiltered narrative absorption risk (Error #48),
      2) the orchestrator lacks the agent's systematic framework for classifying sources,
      3) it bypasses the meta-reflection protocol that catches anomalies.
      Rule reinforced: ANY information gathering from external sources → delegate to appropriate agent.
      No exceptions for "quick" or "simple" lookups.

  - date: 2026-03-10
    lesson: "Full R1-R4 pipeline can dramatically change investment conclusion — R1 alone is insufficient for decision"
    from_decision: "BAH R1 FV $105 (attractive) → R3 FV $78 (zero MoS) → Committee CONDITIONAL at $75. DEPRIORITIZED."
    impact: |
      BAH R1 thesis showed contrarian opportunity: P/E 11.5x vs sector 30-85x, DOGE impact ~6%.
      R3 resolution lowered FV 26% ($105→$78): DOGE assessed 60% structural (not cyclical),
      Palantir existential threat for advisory, AI revenue 50% relabeled. Committee adjusted QS 73→68.
      At $77.52, zero MoS vs R3 FV. Entry requires -30% decline to $55.
      Lesson: R1 by nature is the BULL case. Without adversarial pipeline, FVs systematically inflated.
      This validates Error #65 (systematic bullish bias from skipping DA).

  - date: 2026-03-11
    lesson: "Investor day briefings rarely change thesis — incremental updates are the norm"
    from_decision: "FTNT Accelerate 2026 Investor Day: NEUTRAL verdict, FV $88 unchanged"
    impact: |
      SASE +40% Q4 confirmed but was KNOWN from Q4 earnings. FortiOS 8.0 and FortiSOC
      are substantive but don't change near-term financials. No FY27 guide raise, no SASE ARR
      disclosure, no SP6 timeline. Stock flat ($81-$85 range). Market agrees — nothing new.
      Lesson: Don't overweight investor day outcomes. Q1 actuals (May 6) matter more than
      forward-looking product announcements. Position decisions should wait for financial data.

  - date: 2026-03-11
    lesson: "Preserve cash optionality before binary earnings events"
    from_decision: "DNLM.L TRIGGERED at 921p (<950p SO) but NOT executed. EUR 370 cash reserved for ADBE Q1 tonight."
    impact: |
      DNLM.L R4 approved, FV 1008p, QS 79 Tier A. E[CAGR] ~14.5% at 921p. Meets threshold.
      BUT: EUR 370 cash = one position only. ADBE Q1 earnings tonight = potential ADD opportunity
